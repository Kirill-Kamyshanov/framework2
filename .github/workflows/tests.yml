name: run tests

on:
  - push
  - pull_request

jobs:
  run_python_tests:
    runs-on: python:3.14-alpine3.24

    steps:
      # Клонирование кода репозитория на машину Github actions
      - name: Checkout repository
      - uses: actions/checkout@v6

      # Установка зависимостей проекта
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Запуск тестов
      - name: run tests
        run: pytest