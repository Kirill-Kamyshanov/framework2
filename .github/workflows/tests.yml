name: run tests

on:
  - push
  - pull_request

jobs:
  run_python_tests:
    runs-on: ubuntu-latest

    steps:
      # Клонирование кода репозитория на машину Github actions
      - name: Checkout repository
        uses: actions/checkout@v6

      # Установка Python
      - name: set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      # Установка зависимостей проекта
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Запуск тестов
      - name: run tests
        run: pytest
        continue-on-error: true
        env:
          REQRES_API_KEY: ${{ secrets.REQRES_API_KEY }}

      # Генерация /allure-results
      - name: Upload Test results
        uses: actions/upload-artifact@v7
        with:
          name: allure-results
          path: allure-results

      # Генерация /allure-report
      - name: generate allure-report
        uses: simple-elf/allure-report-action@v1.15
        with:
          allure_results: allure-results
          gh_pages: gh-pages
          allure_report: allure-report

      - name: Upload allure-report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report



  deploy_report:
    needs: run_python_tests
    runs-on: ubuntu-latest
    steps:

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download allure-report
        uses: actions/download-artifact@v4
        with:
          name: allure-report
          path: allure-report

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
          publish_branch: gh-pages
          keep_files: false
          destination_dir: .